<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">超级视频 super-video</title>
  <desc id="heroDesc">把写好的文案一键变成带中文配音与同步字幕的成片视频。左侧为项目名与一句话价值；右侧为七步生产管线示意：整段合成、词级转写、强制对齐、数据驱动生成、渲染、后置混音、验证，其中第三步强制对齐以荧光黄标记为时间轴真源；底部一条字幕条示意整句同步字幕。</desc>

  <defs>
    <!-- 墨线网格：呼应项目 paper 主题的网格背景 -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#1A1A18" stroke-width="1" opacity="0.05"/>
    </pattern>
    <!-- 字幕条阴影（低透明度，仅用于分离层） -->
    <filter id="capShadow" x="-10%" y="-60%" width="120%" height="260%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A1A18" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 背景：纸感米白 -->
  <rect width="1200" height="340" rx="26" fill="#F5F3EE"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <!-- 内描边：墨线，克制 -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="26" fill="none" stroke="#1A1A18" stroke-width="1" opacity="0.14"/>

  <!-- ===================== 左：标题区 ===================== -->
  <g id="title-block" transform="translate(64 74)">
    <!-- 分类标签 -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="17" font-weight="600" letter-spacing="3.4" fill="#1A1A18" opacity="0.55">AGENT SKILL · VIDEO</text>

    <!-- 项目名 -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="62" font-weight="800" letter-spacing="1" fill="#1A1A18">超级视频</text>

    <!-- 一句话价值 -->
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="21" font-weight="500" fill="#1A1A18" opacity="0.82">一段写好的文案，一键成为成片。</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="21" font-weight="500" fill="#1A1A18" opacity="0.82">中文配音 · 同步字幕 · 动画画面，全程自动。</text>

    <!-- 元信息：mono（上移，让出底部字幕条专属空间） -->
    <text x="0" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#1A1A18" opacity="0.6">super-video · MIT · Windows / macOS / Linux</text>
  </g>

  <!-- ===================== 右：证据区（七步管线） ===================== -->
  <g id="pipeline" transform="translate(660 66)">
    <!-- 面板底 -->
    <rect x="0" y="0" width="478" height="208" rx="14" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1" opacity="0.9"/>
    <rect x="0" y="0" width="478" height="208" rx="14" fill="none" stroke="#1A1A18" stroke-width="1" opacity="0.10"/>

    <!-- 面板标题 -->
    <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" font-weight="700" letter-spacing="1.6" fill="#1A1A18" opacity="0.65">PIPELINE · 7 STEPS</text>

    <!-- 时间轴主线 -->
    <line x1="30" y1="112" x2="448" y2="112" stroke="#1A1A18" stroke-width="1.5" opacity="0.22"/>

    <!-- 七个节点：x = 30 + i*69.6 -->
    <!-- 1 合成 -->
    <g transform="translate(30 112)">
      <circle r="9" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.6"/>
      <circle r="3.4" fill="#1A1A18"/>
      <text y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="15" fill="#1A1A18" opacity="0.85">合成</text>
      <text y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#1A1A18" opacity="0.45">01</text>
    </g>
    <!-- 2 转写 -->
    <g transform="translate(99.6 112)">
      <circle r="9" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.6"/>
      <circle r="3.4" fill="#1A1A18"/>
      <text y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="15" fill="#1A1A18" opacity="0.85">转写</text>
      <text y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#1A1A18" opacity="0.45">02</text>
    </g>
    <!-- 3 对齐 —— 核心真源，荧光黄高亮 -->
    <g transform="translate(169.2 112)">
      <circle r="14" fill="#FFEE58"/>
      <circle r="14" fill="none" stroke="#1A1A18" stroke-width="1.6"/>
      <circle r="4" fill="#1A1A18"/>
      <text y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="15" font-weight="700" fill="#1A1A18">对齐</text>
      <text y="55" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" font-weight="700" fill="#1A1A18" opacity="0.75">03</text>
    </g>
    <!-- 4 生成 -->
    <g transform="translate(238.8 112)">
      <circle r="9" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.6"/>
      <circle r="3.4" fill="#1A1A18"/>
      <text y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="15" fill="#1A1A18" opacity="0.85">生成</text>
      <text y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#1A1A18" opacity="0.45">04</text>
    </g>
    <!-- 5 渲染 -->
    <g transform="translate(308.4 112)">
      <circle r="9" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.6"/>
      <circle r="3.4" fill="#1A1A18"/>
      <text y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="15" fill="#1A1A18" opacity="0.85">渲染</text>
      <text y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#1A1A18" opacity="0.45">05</text>
    </g>
    <!-- 6 混音 -->
    <g transform="translate(378 112)">
      <circle r="9" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.6"/>
      <circle r="3.4" fill="#1A1A18"/>
      <text y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="15" fill="#1A1A18" opacity="0.85">混音</text>
      <text y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#1A1A18" opacity="0.45">06</text>
    </g>
    <!-- 7 验证 —— 终点，实心墨点 -->
    <g transform="translate(448 112)">
      <circle r="10" fill="#1A1A18"/>
      <path d="M-4.4 0 L-1 3.6 L4.6 -3.6" fill="none" stroke="#FFEE58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="15" font-weight="700" fill="#1A1A18">成片</text>
      <text y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#1A1A18" opacity="0.55">07</text>
    </g>

    <!-- 高亮注释：指向第 3 步 -->
    <line x1="169.2" y1="95" x2="169.2" y2="76" stroke="#1A1A18" stroke-width="1" opacity="0.35" stroke-dasharray="3 3"/>
    <text x="169.2" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" font-weight="700" fill="#1A1A18" opacity="0.8">时间轴真源</text>
  </g>

  <!-- ===================== 底部：字幕条（项目招牌特征） ===================== -->
  <g id="caption" transform="translate(600 300)">
    <rect x="-250" y="-25" width="500" height="50" rx="8" fill="#FFFFFF" filter="url(#capShadow)"/>
    <rect x="-250" y="-25" width="500" height="50" rx="8" fill="none" stroke="#1A1A18" stroke-width="1" opacity="0.16"/>
    <text x="0" y="7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="22" font-weight="700" fill="#1A1A18">音频定时间，画面跟着音频走</text>
  </g>
</svg>
